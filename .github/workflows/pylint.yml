name: Pylint and Coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"] 

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Combined all requirements here for speed
        pip install pylint pytrends pandas matplotlib pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Analysing the code with pylint
      run: |
        # This checks your specific folder
        pylint data_collection/

    - name: Run unit tests with coverage
      run: |
        # This uses your pyproject.toml settings
        pytest --cov=data_collection --cov-report=term-missing